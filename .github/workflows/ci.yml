# Offline test suite. No simulator, SimConnect.dll or live evidence is used:
# the guarded runner blocks native DLL loads, sockets and subprocesses while the
# tests run, and Qt uses the offscreen platform.
#
# Each job also builds a real wheel from pyproject.toml, checks that it holds
# every package in the tree (bbc_core, bbc_core.ipc, bbc_efb,
# bbc_efb.logbook_views, bbc_efb.modules, bbc_recorder), installs it
# (not editable) and imports it from outside the repository, so a package that
# pyproject.toml leaves out fails CI instead of silently disabling a feature.
#
# This workflow has not run on GitHub yet: nothing has been pushed since it was
# written. Treat its first green run as the first evidence.
name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheel" .

      - name: Check the wheel holds every package
        run: |
          wheel=$(python -c "import glob, os; print(glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'wheel', 'bbc_efb-*.whl'))[0])")
          python -I packaging/package_tools.py check-wheel "$wheel"

      - name: Install the wheel with the UI extra (not editable)
        run: |
          wheel=$(python -c "import glob, os; print(glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'wheel', 'bbc_efb-*.whl'))[0])")
          python -m pip install "${wheel}[ui]"

      - name: Import the installed packages from outside the repository
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import bbc_recorder.service, bbc_core.host, bbc_core.ipc, bbc_efb, bbc_efb.logbook_views,
          bbc_efb.modules, bbc_efb.__main__, bbc_efb.app; import pathlib;
          assert 'site-packages' in pathlib.Path(bbc_recorder.service.__file__).parts, bbc_recorder.service.__file__;
          print('installed', bbc_efb.VERSION)"

      - name: Run the full suite (repository root as top level)
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Run the guarded offline suite
        run: python -B tests/test_repo_offline_guard.py

  # Static checks (finding A89) with the settings in pyproject.toml. ADVISORY until the
  # first run is reviewed: the code has not yet been checked with either tool, so known
  # findings (for example unused imports in bbc_core) are reported without failing CI.
  # Remove continue-on-error once a run is clean so the configuration guards something.
  static-checks:
    name: Static checks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned static-check tools
        run: python -m pip install "ruff==0.6.9" "mypy==1.11.2"

      - name: ruff check
        run: ruff check bbc_core bbc_efb bbc_recorder

      - name: mypy (bbc_core)
        run: mypy
